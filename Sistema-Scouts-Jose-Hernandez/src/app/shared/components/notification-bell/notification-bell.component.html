<div class="relative">
  <!-- Notification Bell Button -->
  <button
    (click)="toggleDropdown()"
    class="relative p-2 text-gray-600 hover:text-gray-800 focus:outline-none transition-colors"
    [class.text-green-600]="unreadCount > 0"
  >
    <!-- Bell Icon -->
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      />
    </svg>
    
    <!-- Unread Count Badge -->
    <span
      *ngIf="unreadCount > 0"
      class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center min-w-[1.25rem]"
    >
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isDropdownOpen"
    class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg ring-1 ring-black ring-opacity-5 z-50"
  >
    <!-- Header -->
    <div class="px-4 py-3 border-b border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-900">Notificaciones</h3>
        <button
          *ngIf="unreadCount > 0"
          (click)="markAllAsRead()"
          class="text-xs text-green-600 hover:text-green-700"
        >
          Marcar todas como leídas
        </button>
      </div>
    </div>

    <!-- Notifications List -->
    <div class="max-h-96 overflow-y-auto">
      <ng-container *ngIf="notifications.length > 0; else noNotifications">
        <div
          *ngFor="let notification of notifications; trackBy: trackByNotificationId"
          class="px-4 py-3 border-b border-gray-100 last:border-b-0 hover:bg-gray-50 cursor-pointer"
          [class.bg-blue-50]="!notification.read"
          (click)="onNotificationClick(notification)"
        >
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-900 truncate">
                {{ notification.title }}
              </p>
              <p class="text-sm text-gray-600 mt-1 line-clamp-2">
                {{ notification.message }}
              </p>
              <p class="text-xs text-gray-400 mt-1">
                {{ getRelativeTime(notification.createdAt) }}
              </p>
            </div>
            
            <!-- Unread indicator -->
            <div *ngIf="!notification.read" class="ml-2 flex-shrink-0">
              <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
            </div>
            
            <!-- Action buttons (show on hover) -->
            <div class="ml-2 flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
              <button
                *ngIf="!notification.read"
                (click)="markAsRead(notification.id, $event)"
                class="text-xs text-green-600 hover:text-green-700 mr-2"
                title="Marcar como leída"
              >
                ✓
              </button>
              <button
                (click)="deleteNotification(notification.id, $event)"
                class="text-xs text-red-600 hover:text-red-700"
                title="Eliminar"
              >
                ×
              </button>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noNotifications>
        <div class="px-4 py-8 text-center">
          <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <h3 class="mt-2 text-sm font-medium text-gray-900">No hay notificaciones</h3>
          <p class="mt-1 text-sm text-gray-500">Te avisaremos cuando tengas nuevas notificaciones.</p>
        </div>
      </ng-template>
    </div>

    <!-- Footer -->
    <div class="px-4 py-2 border-t border-gray-200 bg-gray-50 rounded-b-lg">
      <button
        (click)="viewAllNotifications()"
        class="w-full text-center text-sm text-green-600 hover:text-green-700 font-medium"
      >
        Ver todas las notificaciones
      </button>
    </div>
  </div>
</div>

<!-- Backdrop to close dropdown when clicking outside -->
<div
  *ngIf="isDropdownOpen"
  class="fixed inset-0 z-40"
  (click)="closeDropdown()"
></div>
